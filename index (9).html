<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cironix</title>
<meta name="description" content="Cironix es un asistente de IA gratuito. Sin registro y sin tarjeta.">
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400..600&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: dark;
    --bg:#000000; --text:#ECECEE; --mute:#8B8B93; --line:#242428; --surface:#0C0C0E;
    --bubble:#1A1A1D; --code:#121215; --blue:#005EFF;
    --err:#FF9A8F; --err-bg:#1F0F0E;
    --font:"Geist", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }

  * { box-sizing:border-box; }
  html { background:var(--bg); }
  html, body { height:100%; margin:0; }
  body {
    background:var(--bg); color:var(--text);
    font:400 16px/1.6 var(--font);
    height:100dvh; display:flex; flex-direction:column;
    -webkit-font-smoothing:antialiased;
  }
  .shell { width:100%; max-width:720px; height:100%; margin:0 auto; display:flex; flex-direction:column; min-height:0; }

  /* Cabecera */
  .top { display:flex; align-items:center; padding:18px 20px 8px; }
  .brand { display:flex; align-items:center; gap:10px; font-weight:500; font-size:1.05rem; letter-spacing:-.01em; }
  .brand img { width:30px; height:30px; display:block; }

  /* Conversación */
  .log {
    flex:1; min-height:0; overflow-y:auto; padding:8px 20px 28px;
    display:flex; flex-direction:column; gap:26px; scroll-behavior:smooth;
    scrollbar-width:thin; scrollbar-color:#2A2A2F transparent;
  }

  /* Bienvenida */
  .welcome { margin:auto 0; padding:2vh 0 8vh; text-align:center; display:flex; flex-direction:column; align-items:center; }
  .welcome .big { width:84px; height:84px; display:block; margin-bottom:26px; }
  .welcome h1 { margin:0 0 10px; font-weight:500; font-size:clamp(1.7rem, 6vw, 2.25rem); line-height:1.15; letter-spacing:-.025em; }
  .welcome p { margin:0 0 28px; color:var(--mute); max-width:32ch; }
  .starts { display:flex; flex-wrap:wrap; justify-content:center; gap:8px; }
  .start {
    font:inherit; font-size:.92rem; color:var(--mute); background:transparent;
    border:1px solid var(--line); border-radius:999px; padding:8px 15px; cursor:pointer;
    transition:color .15s, border-color .15s;
  }
  .start:hover { color:var(--text); border-color:#3C3C42; }

  /* Mensajes */
  .row { display:flex; gap:12px; align-items:flex-start; }
  .row.me { justify-content:flex-end; }
  .bubble {
    max-width:82%; padding:10px 16px; background:var(--bubble);
    border-radius:20px 20px 6px 20px; white-space:pre-wrap; overflow-wrap:anywhere;
  }
  .avatar { flex:none; width:26px; height:26px; margin-top:1px; display:block; }
  .reply { min-width:0; flex:1; overflow-wrap:anywhere; line-height:1.7; }
  .reply p { margin:0 0 .8em; }
  .reply > :last-child { margin-bottom:0; }
  .reply ul, .reply ol { margin:0 0 .8em; padding-left:1.35em; }
  .reply li { margin:.25em 0; }
  .reply li::marker { color:var(--mute); }
  .reply .sub { margin:.3em 0 .45em; font-weight:600; font-size:1.05rem; line-height:1.35; }
  .reply code { font:.88em ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; background:var(--code); border:1px solid var(--line); padding:.1em .38em; border-radius:6px; }
  .reply pre { margin:0 0 .8em; padding:12px 14px; background:var(--code); border:1px solid var(--line); border-radius:12px; overflow-x:auto; line-height:1.5; }
  .reply pre code { padding:0; background:none; border:0; }
  .wait { color:var(--mute); }
  .reply.fail { color:var(--err); background:var(--err-bg); padding:11px 14px; border-radius:14px; }
  .retry {
    margin-top:8px; font:inherit; font-size:.9rem; font-weight:500; color:inherit; background:transparent;
    border:1px solid currentColor; border-radius:999px; padding:5px 13px; cursor:pointer;
  }

  /* El logo late mientras Cironix piensa */
  .row.thinking .avatar { animation:pulse 1.3s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity:.35; } }

  /* Escritura */
  .bottom { padding:6px 20px calc(14px + env(safe-area-inset-bottom, 0px)); }
  .box {
    display:flex; align-items:flex-end; gap:8px; background:var(--surface);
    border:1px solid var(--line); border-radius:26px; padding:7px 7px 7px 20px;
    transition:border-color .15s, box-shadow .15s;
  }
  .box:focus-within { border-color:var(--blue); box-shadow:0 0 0 3px rgba(0,94,255,.28); }
  textarea {
    flex:1; min-width:0; resize:none; border:0; outline:0; background:transparent; color:inherit;
    font:inherit; line-height:1.5; padding:8px 0; max-height:160px;
  }
  textarea::placeholder { color:var(--mute); }
  .go {
    flex:none; width:42px; height:42px; border:0; border-radius:50%; cursor:pointer;
    background:var(--blue); color:#fff; display:grid; place-items:center;
    transition:opacity .15s, transform .15s, background .15s;
  }
  .go:active:not(:disabled) { transform:scale(.94); }
  .go:disabled { background:#1E1E22; color:#5A5A62; cursor:default; }
  .go svg { width:20px; height:20px; }
  .go:focus-visible, .start:focus-visible, .retry:focus-visible { outline:2px solid #fff; outline-offset:2px; }
  .fine { margin:10px 0 0; text-align:center; color:var(--mute); font-size:.78rem; }

  @media (max-width:480px) { .bubble { max-width:88%; } }
  @media (prefers-reduced-motion: reduce) {
    .log { scroll-behavior:auto; }
    .row.thinking .avatar { animation:none; }
  }
</style>
</head>
<body>
<div class="shell">
  <header class="top">
    <div class="brand" id="brand"></div>
  </header>

  <main class="log" id="log" role="log" aria-live="polite" aria-label="Conversación con Cironix">
    <section class="welcome" id="welcome">
      <div id="big"></div>
      <h1>¿En qué te ayudo?</h1>
      <p>Respondo en tu idioma. Es gratis y no hace falta registrarte.</p>
      <div class="starts">
        <button type="button" class="start" data-fill="Explicame con palabras simples: ">Explicar algo con palabras simples</button>
        <button type="button" class="start" data-fill="Ayudame a escribir un mensaje para ">Escribir un mensaje</button>
        <button type="button" class="start" data-fill="Dame ideas para ">Pedir ideas</button>
        <button type="button" class="start" data-fill="Traducí al inglés: ">Traducir un texto</button>
      </div>
    </section>
  </main>

  <footer class="bottom">
    <form class="box" id="f">
      <textarea id="t" rows="1" maxlength="2000" placeholder="Escribí tu mensaje" aria-label="Mensaje"></textarea>
      <button class="go" id="s" type="submit" aria-label="Enviar mensaje" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
      </button>
    </form>
    <p class="fine">Cironix puede equivocarse. Revisá lo importante.</p>
  </footer>
</div>

    }).join("");
  }
  function blocks(x) {
    const lines = x.split("\n"); let out = "", i = 0;
    while (i < lines.length) {
      const l = lines[i];
      if (!l.trim()) { i++; continue; }
      let m;
      if ((m = l.match(/^#{1,4}\s+(.*)$/))) { out += '<p class="sub">' + inline(m[1]) + "</p>"; i++; continue; }
      if (/^\s*[-*•]\s+/.test(l)) {
        out += "<ul>";
        while (i < lines.length && /^\s*[-*•]\s+/.test(lines[i])) { out += "<li>" + inline(lines[i].replace(/^\s*[-*•]\s+/, "")) + "</li>"; i++; }
        out += "</ul>"; continue;
      }
      if (/^\s*\d+[.)]\s+/.test(l)) {
        out += "<ol>";
        while (i < lines.length && /^\s*\d+[.)]\s+/.test(lines[i])) { out += "<li>" + inline(lines[i].replace(/^\s*\d+[.)]\s+/, "")) + "</li>"; i++; }
        out += "</ol>"; continue;
      }
      const para = [];
      while (i < lines.length && lines[i].trim() && !/^#{1,4}\s/.test(lines[i]) && !/^\s*([-*•]|\d+[.)])\s+/.test(lines[i])) { para.push(inline(lines[i])); i++; }
      out += "<p>" + para.join("<br>") + "</p>";
    }
    return out;
  }
  function md(raw) {
    const safe = esc(String(raw));
    let out = "", last = 0, m; const re = /```[^\n`]*\n?([\s\S]*?)```/g;
    while ((m = re.exec(safe))) {
      out += blocks(safe.slice(last, m.index)) + "<pre><code>" + m[1].replace(/\n$/, "") + "</code></pre>";
      last = re.lastIndex;
    }
    return out + blocks(safe.slice(last));
  }
  // md:end

  function toBottom() { log.scrollTop = log.scrollHeight; }
  function addUser(text) {
    const row = document.createElement("div"); row.className = "row me";
    const b = document.createElement("div"); b.className = "bubble"; b.textContent = text;
    row.appendChild(b); log.appendChild(row); toBottom();
  }
  function addBot() {
    const row = document.createElement("div"); row.className = "row thinking";
    const av = document.createElement("img"); av.className = "avatar"; av.src = LOGO; av.alt = "";
    const body = document.createElement("div"); body.className = "reply wait"; body.textContent = "Pensando…";
    row.appendChild(av); row.appendChild(body); log.appendChild(row); toBottom();
    return { row: row, body: body };
  }
  function syncSend() { s.disabled = busy || !t.value.trim(); }
  function grow() { t.style.height = "auto"; t.style.height = Math.min(t.scrollHeight, 160) + "px"; }

  async function ask(text, retry) {
    if (busy || !text) return;
    busy = true; syncSend();
    const w = document.getElementById("welcome"); if (w) w.remove();
    if (!retry) addUser(text);
    history.push({ role: "user", content: text });
    const bot = addBot();
    try {
      const r = await fetch("/.netlify/functions/chat", {
        method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ messages: history })
      });
      let data; try { data = await r.json(); } catch (e) { data = {}; }
      if (!r.ok) throw new Error(data.error || "Algo salió mal. Probá de nuevo.");
      if (!data.reply) throw new Error("No llegó ninguna respuesta. Probá de nuevo.");
      bot.body.className = "reply"; bot.body.innerHTML = md(data.reply);
      history.push({ role: "assistant", content: data.reply });
    } catch (err) {
      history.pop();
      bot.body.className = "reply fail";
      bot.body.textContent = err instanceof TypeError ? "No hay conexión. Revisá tu internet y probá de nuevo." : err.message;
      const btn = document.createElement("button"); btn.type = "button"; btn.className = "retry"; btn.textContent = "Probar de nuevo";
      btn.addEventListener("click", function () { bot.row.remove(); ask(text, true); });
      bot.body.appendChild(document.createElement("br")); bot.body.appendChild(btn);
    }
    bot.row.classList.remove("thinking");
    busy = false; syncSend(); toBottom(); t.focus();
  }

  function submit() { const text = t.value.trim(); if (!text) return; t.value = ""; grow(); ask(text, false); }
  form.addEventListener("submit", function (e) { e.preventDefault(); submit(); });
  t.addEventListener("input", function () { grow(); syncSend(); });
  t.addEventListener("keydown", function (e) { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); submit(); } });
  document.querySelectorAll(".start").forEach(function (b) {
    b.addEventListener("click", function () { t.value = b.dataset.fill; grow(); syncSend(); t.focus(); });
  });
</script>
