<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cironix</title>
<style>
  :root { --bg:#fff; --ink:#16181d; --mute:#6b7280; --line:#e5e7eb; --user:#16181d; --userink:#fff; --bot:#f3f4f6; --accent:#2f5bff; }
  @media (prefers-color-scheme: dark) { :root:not(.l) { --bg:#fff; } }
  * { box-sizing:border-box; }
  html,body { height:100%; margin:0; }
  body { background:var(--bg); color:var(--ink); font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; display:flex; flex-direction:column; max-width:720px; margin:0 auto; }
  header { padding:20px 16px 8px; }
  h1 { margin:0; font-size:2.2rem; letter-spacing:-.04em; font-weight:800; }
  header p { margin:2px 0 0; color:var(--mute); font-size:.95rem; }
  #log { flex:1; overflow-y:auto; padding:12px 16px; display:flex; flex-direction:column; gap:10px; }
  .m { max-width:85%; padding:10px 14px; border-radius:16px; white-space:pre-wrap; overflow-wrap:anywhere; }
  .u { align-self:flex-end; background:var(--user); color:var(--userink); border-bottom-right-radius:4px; }
  .b { align-self:flex-start; background:var(--bot); border-bottom-left-radius:4px; }
  .b.err { color:#b42318; background:#fef3f2; }
  .empty { margin:auto; text-align:center; color:var(--mute); }
  form { display:flex; gap:8px; padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px)); border-top:1px solid var(--line); }
  textarea { flex:1; resize:none; border:1px solid var(--line); border-radius:12px; padding:10px 12px; font:inherit; max-height:140px; }
  textarea:focus, button:focus-visible { outline:2px solid var(--accent); outline-offset:1px; }
  button { border:0; background:var(--accent); color:#fff; font:inherit; font-weight:600; border-radius:12px; padding:0 18px; cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
</style>
</head>
<body>
<header><h1>Cironix</h1><p>Preguntame lo que quieras.</p></header>
<div id="log"><div class="empty" id="empty">Escribí tu primer mensaje abajo.</div></div>
<form id="f">
  <textarea id="t" rows="1" placeholder="Escribí un mensaje" maxlength="2000" aria-label="Mensaje"></textarea>
  <button id="s" type="submit">Enviar</button>
</form>
<script>
  const log = document.getElementById("log"), t = document.getElementById("t"), s = document.getElementById("s");
  const history = [];
  function add(text, cls) {
    const e = document.getElementById("empty"); if (e) e.remove();
    const d = document.createElement("div"); d.className = "m " + cls; d.textContent = text;
    log.appendChild(d); log.scrollTop = log.scrollHeight; return d;
  }
  async function send() {
    const text = t.value.trim(); if (!text) return;
    t.value = ""; add(text, "u"); history.push({ role: "user", content: text });
    s.disabled = true; const wait = add("Escribiendo…", "b");
    try {
      const r = await fetch("/.netlify/functions/chat", { method: "POST", headers: {"Content-Type":"application/json"}, body: JSON.stringify({ messages: history }) });
      const data = await r.json();
      if (!r.ok) throw new Error(data.error || "Error");
      wait.textContent = data.reply; history.push({ role: "assistant", content: data.reply });
    } catch (err) { wait.textContent = err.message; wait.classList.add("err"); history.pop(); }
    s.disabled = false; log.scrollTop = log.scrollHeight; t.focus();
  }
  document.getElementById("f").addEventListener("submit", e => { e.preventDefault(); send(); });
  t.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); } });
</script>
</body>
</html>
